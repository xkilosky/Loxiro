plugins { id 'com.android.application' }

// Release signing. The keystore is deliberately NOT in this repository: anyone
// holding it can publish updates as Veilix, so it is owner-managed and lives in
// android/keystore.properties (gitignored) or, in CI, in repository secrets.
// With no keystore present the release build is left unsigned rather than
// failing, so a fresh clone and a secret-less CI run both still build.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseKeystore = keystorePropertiesFile.exists()

android {
    // Source package for generated code (R, BuildConfig). Kept in step with the
    // Java sources under java/app/veilix/browser.
    namespace 'app.veilix.browser'
    compileSdk 35
    defaultConfig {
        // Deliberately still the pre-rename id: it owns the on-device data directory
        // (/data/data/app.loxiro.browser), so keeping it means existing installs
        // upgrade in place instead of losing tabs and settings.
        applicationId 'app.loxiro.browser'
        minSdk 29
        targetSdk 35
        // Kept in step with the hosted app's package.json. The shell is only a
        // wrapper -- the app it loads comes from the deployed site -- but a stale
        // versionName makes the installed app look abandoned in Android's app info.
        versionCode 8
        versionName '0.8.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties.getProperty('storeFile', 'veilix-release.jks'))
            storePassword keystoreProperties.getProperty('storePassword', '')
            keyAlias keystoreProperties.getProperty('keyAlias', '')
            keyPassword keystoreProperties.getProperty('keyPassword', '')
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKeystore) signingConfig signingConfigs.release
        }
    }
    testOptions { animationsDisabled true }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:espresso-intents:3.6.1'
}
