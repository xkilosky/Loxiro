plugins { id 'com.android.application' }
android {
    // Source package for generated code (R, BuildConfig). Kept in step with the
    // Java sources under java/app/veilix/browser.
    namespace 'app.veilix.browser'
    compileSdk 35
    defaultConfig {
        // Deliberately still the pre-rename id: it owns the on-device data directory
        // (/data/data/app.loxiro.browser), so keeping it means existing installs
        // upgrade in place instead of losing tabs and settings.
        applicationId 'app.loxiro.browser'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '0.7.0-preview.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { animationsDisabled true }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
}
