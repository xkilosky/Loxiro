name: Android browser preview
on:
  push:
    branches: [main, 'arena/**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Materialise release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; the release APK will be unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > veilix-release.jks
          {
            echo "storeFile=veilix-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      # Split into separate steps rather than one gradle invocation: the step
      # name then says which task failed, which matters because the job's log
      # download is not always reachable and the annotation only carries a
      # generic "exit code 1".
      - name: JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Build instrumentation tests
        run: ./gradlew --no-daemon assembleDebugAndroidTest
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veilix-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veilix-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real website tab tests on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Publish instrumentation failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for case in ET.parse(path).iter('testcase'):
                  for kind in ('failure', 'error'):
                      for failure in case.findall(kind):
                          message = (case.get('name', '') + ': ' + (failure.text or failure.get('message', '')))[:12000]
                          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error title=Android instrumentation failure::' + message)
          PYTHON
      - name: Collect visual tab-switcher screenshots
        if: always()
        run: |
          mkdir -p app/build/reports/tab-ui
          adb pull /sdcard/Android/data/app.veilix.browser/files/tab-ui/. app/build/reports/tab-ui/ || true
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
