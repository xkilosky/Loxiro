<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080B14" />
    <script>
      // Apply a saved appearance before the app/CSS loads; blocked storage stays Arctic.
      try {
        const saved = JSON.parse(localStorage.getItem('loxiro:v2:settings') || '{}');
        const theme = ['light','dark','system'].includes(saved?.theme) ? saved.theme : 'dark';
        const resolved = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        document.documentElement.dataset.theme = resolved;
        document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#080B14' : '#F2F7FD';
      } catch { /* Arctic remains usable without local storage. */ }
    </script>
    <style>html{background:#080B14;color-scheme:dark}html[data-theme=light]{background:#F2F7FD;color-scheme:light}</style>
    <meta name="description" content="Veilix — fast search, fast downloads, smart browser technology. One calm box for the whole web." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Veilix" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Veilix — Search, without the noise</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
